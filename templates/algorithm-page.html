<!doctype html>
<!--
  演算法頁範本。新增演算法時：
  1. 複製成 algorithms/<slug>.html，刪掉所有註解（這段和每個區塊裡的提示都刪）
  2. 把每個 ✏️ 換成內容（規則見 AGENTS.md 第 4、8 節），一個都不能留；注意字數上限
  3. 不要改 <section> 的順序和 id，也不要加「步驟」區塊（步驟由 demo 的逐行虛擬碼負責）
  4. 標題區和上一頁／下一頁由 js/page.js 自動產生，不要手寫；<script> 的順序不要改
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>啟發式演算法圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/site.css">
<link rel="expect" href="#top-bar" blocking="render">
</head>
<body data-slug="✏️slug">
<div class="wrap">
  <header id="page-header"></header>

  <main>
    <section id="analogy">
      <h2>生活比喻</h2>
      <!-- 兩個 emoji（不用動物）＋ 一段日常情境的比喻。整段 80 字以內（emoji 也算）。只講核心想法，不講步驟。 -->
      <div class="emoji" aria-hidden="true">✏️</div>
      <p>✏️</p>
    </section>

    <section id="demo">
      <h2>一行一行看它跑</h2>
      <!-- 只放這一行，面板由 js/demo.js 產生；虛擬碼來自程式裡的 pseudo。
           成績單不要手寫：登記成 ready 之後執行 node tests/stats.mjs <slug> --write，會接在這一行下面。 -->
      <div class="demo" data-algorithm="✏️slug"></div>
    </section>

    <section id="params">
      <h2>參數怎麼調</h2>
      <!-- 每個參數一列，data-key 要和程式的 key 一樣；最後一欄寫預設值，兩種問題都支援就兩個都寫（例：「地形 0.25／TSP 20」）。
           表格下可以有一段補充（80 字以內；不開放調整的固定常數寫在這裡）。沒有參數的演算法：刪掉表格，改寫一句話說明。 -->
      <div class="table-scroll">
        <table>
          <thead><tr><th>參數</th><th>意思</th><th>調大會怎樣</th><th>預設值</th></tr></thead>
          <tbody>
            <tr data-key="✏️key"><td>✏️</td><td>✏️</td><td>✏️</td><td>✏️</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="try">
      <h2>試試看</h2>
      <!-- 2～3 個實驗。每個 <p> 80 字以內：地圖＋種子＋會看到什麼數字。
           數字照 node tests/presets.mjs <slug> 的輸出寫；每個實驗都要自己先按過，確定現象真的看得到。 -->
      <ol class="try-list">
        <li>
          <h3>✏️ 實驗標題</h3>
          <p>✏️</p>
          <button type="button" class="try-set" data-set="problem=✏️&amp;map=✏️&amp;seed=✏️">套用這組設定 ▶</button>
        </li>
      </ol>
    </section>

    <section id="fit">
      <h2>適合／不適合</h2>
      <!-- 各 2～3 點，每點 28 字以內。 -->
      <div class="fit-grid">
        <div class="yes"><h3>適合</h3><ul>
          <li>✏️</li>
        </ul></div>
        <div class="no-fit"><h3>不適合</h3><ul>
          <li>✏️</li>
        </ul></div>
      </div>
    </section>

    <section id="related">
      <h2>跟其他演算法的關係</h2>
      <!-- 至少連到 1 個圖鑑裡的演算法。連結就是名稱，後面直接接說明（不加冒號），每點 50 字以內。 -->
      <ul>
        <li><a href="✏️.html">✏️</a>✏️</li>
      </ul>
    </section>

    <section id="refs">
      <h2>參考資料</h2>
      <!-- 格式：作者（年份）。〈標題〉。期刊或會議，卷(期)，頁碼。DOI 連結。查不到就不寫。
           清單前可以加一句 <p> 說明（例：哪一篇提出、本頁實作的是哪一版）。 -->
      <ol>
        <li>✏️</li>
      </ol>
    </section>
  </main>

  <nav id="page-nav" aria-label="上一個／下一個演算法"></nav>
</div>
<script src="../js/core.js"></script>
<script src="../js/backdrop.js"></script>
<script src="../js/registry.js"></script>
<script src="../js/problems/terrain.js"></script>
<script src="../js/problems/tsp.js"></script>
<script src="../js/render.js"></script>
<script src="../js/demo.js"></script>
<script src="../js/page.js"></script>
<script src="../js/algorithms/✏️slug.js"></script>
</body>
</html>
